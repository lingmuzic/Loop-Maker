[project]
name = "loopmaker"
version = "0.3.0"
description = "Turn ambience recordings into seamlessly loopable audio files."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "soundfile>=0.12", "pyloudnorm>=0.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import loopmaker` work when running pytest from the repo root.
pythonpath = ["."]
